<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ .Site.BaseURL }}#website",
      "url": "{{ .Site.BaseURL }}",
      "name": {{ .Site.Title | jsonify }},
      "description": {{ .Site.Params.description | jsonify }},
      "publisher": {
        "@id": "{{ .Site.BaseURL }}#organization"
      },
      "inLanguage": "{{ .Site.LanguageCode | default "en-US" }}"
    },
    {
      "@type": "Organization",
      "@id": "{{ .Site.BaseURL }}#organization",
      "name": {{ .Site.Params.distributorName | jsonify }},
      "url": "{{ .Site.BaseURL }}",
      "logo": {
        "@type": "ImageObject",
        "@id": "{{ .Site.BaseURL }}#logo",
        "url": "{{ .Site.Params.siteLogo | absURL }}",
        "width": 112,
        "height": 112,
        "caption": {{ .Site.Params.companyName | jsonify }}
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": {{ .Site.Params.contact.phone | jsonify }},
        "contactType": "Customer Service",
        "areaServed": "US",
        "availableLanguage": "English"
      },
      "slogan": {{ .Site.Params.tagline | jsonify }},
      "description": {{ .Site.Params.description | jsonify }}
    },
    {
      "@type": "WebPage",
      "@id": "{{ .Permalink }}#webpage",
      "url": "{{ .Permalink }}",
      "name": {{ if .IsHome }}{{ .Site.Title | jsonify }}{{ else }}{{ with .Title }}{{ printf "%s | %s" . $.Site.Title | jsonify }}{{ else }}{{ .Site.Title | jsonify }}{{ end }}{{ end }},
      "isPartOf": {
        "@id": "{{ .Site.BaseURL }}#website"
      },
      {{- if .Params.coverImage -}}
      "primaryImageOfPage": {
        "@type": "ImageObject",
        "@id": "{{ .Permalink }}#primaryimage",
        "url": "{{ .Params.coverImage | absURL }}"
      },
      {{- else if .Params.ogImage -}}
      "primaryImageOfPage": {
        "@type": "ImageObject",
        "@id": "{{ .Permalink }}#primaryimage",
        "url": "{{ .Params.ogImage | absURL }}"
      },
      {{- else if .Site.Params.ogImage -}}
      "primaryImageOfPage": {
        "@type": "ImageObject",
        "@id": "{{ .Permalink }}#primaryimage",
        "url": "{{ .Site.Params.ogImage | absURL }}"
      },
      {{- end -}}
      "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ $.Site.Params.description | jsonify }}{{ end }},
      "breadcrumb": {
        "@id": "{{ .Permalink }}#breadcrumb"
      },
      "inLanguage": "{{ .Site.LanguageCode | default "en-US" }}",
      "potentialAction": {
        "@type": "ReadAction",
        "target": [
          "{{ .Permalink }}"
        ]
      }
    }
    {{- if and .IsHome .Params.faq -}}
    ,{
      "@type": "FAQPage",
      "@id": "{{ .Site.BaseURL }}#faqpage",
      "mainEntity": [
        {{- range $index, $question := .Params.faq.questions -}}
        {
          "@type": "Question",
          "name": {{ $question.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ $question.answer | jsonify }}
          }
        }{{- if ne $index (sub (len $.Params.faq.questions) 1) -}},{{- end -}}
        {{- end -}}
      ]
    }
    {{- end -}}
    
    {{- if eq .Layout "product" -}}
    ,{
      "@type": "Product",
      "name": {{ .Title | jsonify }},
      "description": {{ .Description | jsonify }},
      "sku": {{ .Params.sku | jsonify }},
      "brand": {
        "@type": "Brand",
        "name": {{ .Site.Params.companyName | jsonify }}
      },
      {{- with .Params.priceSection.price -}}
      "offers": {
        "@type": "Offer",
        "price": "{{ . }}",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      },
      {{- end -}}
      "image": [
        {{- with .Params.coverImage -}}
        {{- $image := resources.Get . -}}
        {{- with $image -}}
        {{- $sigma := $.Site.Params.coverImage.filter.unsharpMask.sigma -}}
        {{- $amount := $.Site.Params.coverImage.filter.unsharpMask.amount -}}
        {{- $threshold := $.Site.Params.coverImage.filter.unsharpMask.threshold -}}
        {{- $desktopWidth := $.Site.Params.coverImage.desktopWidth -}}
        {{- $desktopHeight := $.Site.Params.coverImage.desktopHeight -}}
        {{- $format := $.Site.Params.coverImage.format -}}
        {{- $filter := images.UnsharpMask $sigma $amount $threshold -}}
        {{- $processed := $image.Filter $filter -}}
        {{- $final := $processed.Fill (printf "%dx%d %s picture Center" $desktopWidth $desktopHeight $format) -}}
        "{{ $final.RelPermalink }}"
        {{- end -}}
        {{- end -}}
      ]
    }
    {{- if .Params.faq -}}
    ,{
      "@type": "FAQPage",
      "@id": "{{ .Permalink }}#faqpage",
      "mainEntity": [
        {{- range $index, $question := .Params.faq.questions -}}
        {
          "@type": "Question",
          "name": {{ $question.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ $question.answer | jsonify }}
          }
        }{{- if ne $index (sub (len $.Params.faq.questions) 1) -}},{{- end -}}
        {{- end -}}
      ]
    }
    {{- end -}}
    {{- end -}}
    
    {{- if eq .Layout "article" -}}
    ,{
      "@type": "Article",
      "headline": {{ .Title | jsonify }},
      "description": {{ .Description | jsonify }},
      "author": {
        "@type": "Person",
        "name": {{ .Params.author | default .Site.Params.author | jsonify }}
      },
      "publisher": {
        "@type": "Organization",
        "name": {{ .Site.Params.distributorName | jsonify }},
        "logo": {
          "@type": "ImageObject",
          "url": "{{ .Site.Params.siteLogo | absURL }}"
        }
      },
      "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
      "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ .Permalink }}"
      },
      "image": "{{ .Params.coverImage | default .Site.Params.ogImage | absURL }}"
    }
    {{- end -}}
    
    {{- if eq .Layout "about" -}}
    ,{
      "@type": "AboutPage",
      "name": {{ .Title | jsonify }},
      "description": {{ .Description | jsonify }},
      "publisher": {
        "@type": "Organization",
        "name": {{ .Site.Params.distributorName | jsonify }},
        "logo": {
          "@type": "ImageObject",
          "url": "{{ .Site.Params.siteLogo | absURL }}"
        }
      },
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ .Permalink }}"
      }
    }
    {{- end -}}
  ]
}
</script>
