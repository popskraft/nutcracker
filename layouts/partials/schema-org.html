<script type="application/ld+json">
{{- $baseURL := .Site.BaseURL -}}
{{- $permalink := .Permalink -}}
{{- $siteTitle := .Site.Title -}}
{{- $siteDesc := .Site.Params.description -}}
{{- $langCode := .Site.LanguageCode | default "en-US" -}}
{{- $siteLogo := .Site.Params.siteLogo | absURL -}}
{{- $companyName := .Site.Params.companyName -}}
{{- $distributorName := .Site.Params.distributorName -}}
{{- $phone := .Site.Params.contact.phone -}}
{{- $tagline := .Site.Params.tagline -}}
{{- $ogImage := .Site.Params.ogImage | absURL -}}
{{- $pageTitle := cond .IsHome $siteTitle (cond (ne .Title "") (printf "%s | %s" .Title $siteTitle) $siteTitle) -}}
{{- $pageDesc := cond (ne .Description "") .Description $siteDesc -}}
{{- $primaryImage := cond (isset .Params "coverImage") (.Params.coverImage | absURL) (cond (isset .Params "ogImage") (.Params.ogImage | absURL) $ogImage) -}}

{
"@context": "https://schema.org",
"@graph": [
{
"@type": "WebPage",
"@id": "{{ $baseURL }}#webpage",
"name": "{{ $pageTitle | plainify | safeJS }}",
"url": "{{ $baseURL }}",
"isPartOf": {
"@id": "{{ $baseURL }}#website"
},
"primaryImageOfPage": {
"@id": "{{ $baseURL }}#primaryimage"
},
"breadcrumb": {
"@id": "{{ $baseURL }}#breadcrumb"
},
"inLanguage": "{{ $langCode }}",
"potentialAction": {
"@type": "ReadAction",
"target": [
"{{ $baseURL }}"
]
}
},
{{- if eq .Layout "product" -}}
{
"@type": "Product",
"@id": "{{ $baseURL }}#product",
"name": "{{ .Title | plainify | safeJS }}",
"description": "{{ .Description | plainify | safeJS }}",
"image": {
"@id": "{{ $baseURL }}#primaryimage"
},
"offers": {
"@type": "Offer",
"url": "{{ with .Params.productLink }}{{ . }}{{ else }}{{ $baseURL }}#benefits{{ end }}",
"priceCurrency": "USD",
"price": "{{ with .Params.priceSection.price }}{{ replace . "$" "" }}{{ else }}19.99{{ end }}",
"priceValidUntil": "2026-12-31",
"itemCondition": "https://schema.org/NewCondition",
"availability": "https://schema.org/InStock",
"seller": {
"@id": "{{ $baseURL }}#organization"
},
"hasMerchantReturnPolicy": {
"@type": "MerchantReturnPolicy",
"name": "Special Dealer Return Policy",
"returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow"
},
"shippingDetails": {
"@type": "OfferShippingDetails",
"description": "Shipping options vary based on region and order size. Please contact customer service for specific details."
}
},
"aggregateRating": {
"@type": "AggregateRating",
"ratingValue": "4.9",
"reviewCount": "126"
},
"review": [
{{- if isset .Params "testimonials" -}}
{{- $itemCount := len .Params.testimonials.items -}}
{{- range $index, $review := .Params.testimonials.items -}}
{
"@type": "Review",
"reviewRating": {
"@type": "Rating",
"ratingValue": "{{ if not $index }}4{{ else }}5{{ end }}"
},
"author": {
"@type": "Person",
"name": {{ $review.name | plainify | jsonify }}
},
"datePublished": "{{ if eq $index 0 }}2023-12-15{{ else if eq $index 1 }}2023-11-01{{ else if eq $index 2 }}2023-09-20{{ else }}2023-08-10{{ end }}",
"description": {{ $review.text | plainify | jsonify }}
}{{ if lt (add $index 1) (len $.Params.testimonials.items) }},{{ end }}
{{- end -}}
{{- end -}}
]
},
{{- end -}}
{
"@type": "Organization",
"@id": "{{ $baseURL }}#organization",
"name": "AK Dealer Services",
"url": "{{ $baseURL }}",
"logo": {
"@id": "{{ $baseURL }}#logo"
},
"contactPoint": {
"@type": "ContactPoint",
"telephone": "+1-{{ $phone }}",
"contactType": "Customer Service",
"areaServed": "US",
"availableLanguage": "English"
},
"address": {
"@type": "PostalAddress",
"streetAddress": "7315 Gibson Cemetery Rd # 103",
"addressLocality": "Mansfield",
"addressRegion": "TX",
"postalCode": "76063",
"addressCountry": "US"
},
"slogan": "{{ $tagline | safeJS }}",
"legalName": "Nutcracker AK Dealer Services"
},
{
"@type": "WebSite",
"@id": "{{ $baseURL }}#website",
"url": "{{ $baseURL }}",
"name": "{{ $siteTitle | plainify | safeJS }}",
"description": "{{ $siteDesc | plainify | safeJS }}",
"publisher": {
"@id": "{{ $baseURL }}#organization"
},
"inLanguage": "{{ $langCode }}"
},
{{- if .Params.faq -}}
{
"@type": "FAQPage",
"@id": "{{ $baseURL }}#faqpage",
"mainEntity": [
{{- $questionCount := len .Params.faq.questions -}}
{{- range $index, $question := .Params.faq.questions -}}
{
"@type": "Question",
"name": {{ $question.question | plainify | jsonify }},
"acceptedAnswer": {
"@type": "Answer",
"text": {{ $question.answer | plainify | jsonify }}
}
}{{ if lt (add $index 1) (len $.Params.faq.questions) }},{{ end }}
{{- end -}}
]
},
{{- end -}}
{
"@type": "ImageObject",
"@id": "{{ $baseURL }}#primaryimage",
"url": "{{ $primaryImage }}",
"contentUrl": "{{ $primaryImage }}",
"caption": "{{ $pageTitle | plainify | safeJS }}"
},
{
"@type": "BreadcrumbList",
"@id": "{{ $permalink }}#breadcrumb",
"itemListElement": [
{
"@type": "ListItem",
"position": 1,
"name": "Home",
"item": "{{ $baseURL }}"
}
{{- if ne $permalink $baseURL }}
,{
"@type": "ListItem",
"position": 2,
"name": "{{ .Title | plainify }}",
"item": "{{ $permalink }}"
}
{{- end }}
]
},
{
"@type": "ImageObject",
"@id": "{{ $baseURL }}#logo",
"url": "{{ $baseURL }}assets/images/image06.svg",
"contentUrl": "{{ $baseURL }}assets/images/image06.svg"
}
]
}
</script>
