<div id="benefitsContent3Cols" class="style8 container columns">
  <div class="wrapper">
    <div class="inner">
      {{ range $columnIndex, $column := .Page.Params.benefitsColumns }}
      <div>
        {{ range $benefitIndex, $benefit := $column }}
        <h2 id="benefit-title-{{ $columnIndex }}-{{ $benefitIndex }}" class="style5">{{ $benefit.title }}</h2>
        <p id="benefit-text-{{ $columnIndex }}-{{ $benefitIndex }}" class="style3">{{ $benefit.content | markdownify }}</p>
        <hr id="benefit-divider-{{ $columnIndex }}-{{ $benefitIndex }}" class="style1">
        {{ end }}
      </div>
      {{ end }}
    </div>
  </div>
</div>
