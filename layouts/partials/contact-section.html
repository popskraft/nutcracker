<section id="contact-section">
  <div id="formContainer" class="style18 container default">
    <div class="wrapper">
      <div class="inner">
        <p id="text62" class="style13">{{ .Site.Params.contactSection.title | default "Contact Section" }}</p>
        <p id="text74" class="style3">
          {{ .Site.Params.contactSection.description | markdownify }}
        </p>
        {{ partial "formContact" . }}
        <ul id="buttons16" class="style6 buttons">
          <li>
            <a href="#home" class="button n01" role="button"><svg aria-labelledby="buttons16-icon-1-title">
                <title id="buttons16-icon-1-title">Cancel (Light)</title>
                <use xlink:href="/icons.svg#cancel-light"></use>
              </svg><span class="label">Close</span></a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
