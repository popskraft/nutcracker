{{ define "main" }}
<div id="articleListing" class="style10 style-10 container container-component default">
  <div class="wrapper">
    <div class="inner">
      <h1 class="style1 style-1 text-component">{{ .Title }}</h1>
      {{ with .Params.subtitle }}
      <h2 class="style8 style-8 text-component">{{ . | markdownify }}</h2>
      {{ end }}

      {{ partial "listingGallery" . }}

      {{ with .Content }}
        <hr class="style2 style-2 divider-component">
        <p class="style8 style-8 text-component">{{ $.Params.description | markdownify }} </p>
        <hr class="style1 style-1 divider-component">
        <div class="txt">
          {{ . | markdownify }}
        </div>
      {{ end }}

      <hr class="style2 style-2 divider-component">

    </div>
  </div>
</div>
{{ end }}
