baseURL: "https://nutcrackerpro.netlify.app/"
title: Professional-grade tools and products supply
languageCode: "en"
theme: "main"

# Site metadata
params:
  seoTitleAfter: "• Nutcracker Pro"
  description: Professional-grade quality without markup. Streamlined procurement process. American-focused supply chain. Understanding of tradesperson needs. Reliability in stock and delivery.
  colorScheme: "light only"
  openGraph:
    ogImage: "/images/ogimage.jpg"
    type: "website"

  companyName: "Nutcracker"
  tagline: "Secret Gears Of Silent Heroes"
  subtitle: "Pro-grade essentials at accessible prices for those who keep America running"

  contact:
    phone: "Your Phone Number"  # Placeholder for actual phone number
    email: "your.email@example.com"  # Placeholder for actual email

  footer:
    copyright: "All rights reserved."
    terms_text: "By using this site, by sending messages, you agree to the processing of personal data in accordance with the"
    terms_link_text: "Terms & Conditions"
    terms_link: "#terms"

  call_to_action:
    buy_now: "Buy Now"
    wholesale_inquiry: "Wholesale Inquiry"
    read_more: "Read more"

  business_propositions:
    price_point: "$4.99 per box (100 Gloves)"
    savings_potential: "Save up to $3,500 a year"
    minimum_order_quantity: "Minimum pack — 20 boxes (1 container)"

menus:
  main:
    - identifier: "n01"
      name: "Benefits"
      url: "#benefits"
      weight: 1
    - identifier: "n02"
      name: "Great savings"
      url: "#savings"
      weight: 2
    - identifier: "n03"
      name: "F.A.Q."
      url: "#faq"
      weight: 3
    - identifier: "n04"
      name: "Contact"
      url: "#contact"
      weight: 4
    - identifier: "n05"
      name: "All Products"
      url: "https://nutcrackerpro.com/"
      weight: 5


## Settings

markup:
  goldmark:
    renderer:
      unsafe: true  # Allows HTML in markdown
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

pagination:
  pagerSize: 36

summaryLength: 30

sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml

imaging:
  resampleFilter: "Lanczos"
  quality: 95

taxonomies:
  tag: tags

outputs:
  home:
    - "HTML"
    - "RSS"
  section:
    - "HTML"
  taxonomy:
    - "HTML"
  term:
    - "HTML"

minify:
  minifyOutput: true

server:
  headers:
    - for: "/**"
      values:
        X-Frame-Options: "DENY"
        X-XSS-Protection: "1; mode=block"
        X-Content-Type-Options: "nosniff"
        Referrer-Policy: "strict-origin-when-cross-origin"
