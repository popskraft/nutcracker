baseURL: "https://nutcrackerpro.com/"

# $siteName
title: Professional-grade tools and products supply
languageCode: "en"

# Site metadata
params:
  # Form links
  formContactUrl: "https://forms.ju.mp/#nutcracker-contactus"
  formWholesaleUrl: "https://forms.ju.mp/#nutcracker-wholesale"

  # Performance settings
  prefetch:
    enabled: true
    pages:
      - "/"
      - "/hand-cleaner"
      - "/nitrile-gloves"
      - "/about"
    externalUrls:
      - "https://forms.ju.mp/#nutcracker-contactus"
      - "https://forms.ju.mp/#nutcracker-wholesale"
  
  # SEO and metadata settings
  seoTitleAfter: "– Nutcracker Pro"
  description: Professional-grade quality without markup. Streamlined procurement process. American-focused supply chain. Understanding of tradesperson needs. Reliability in stock and delivery.
  ogImage: "/images/ogimage.jpg"
  openGrapeType: "website"
  siteLogo: "logo.svg"

  # Company information
  companyName: "Nutcracker Pro"
  tagline: "Secret Gear Of Silent Heroes"
  distributorName: "AK Dealer Services"
  distributorDescription: "**AK Dealer Services** is an authorized distributor of Nutcracker Pro. You can purchase the product directly from the company's website or contact by phone or email for inquiries."

  # Company address information
  companyAddress:
    streetAddress: "7315 Gibson Cemetery Rd # 103"
    addressLocality: "Mansfield"
    addressRegion: "TX"
    postalCode: "76063"
    addressCountry: "US"

  # Schema.org structured data settings
  schema:
    priceValidUntil: "2026-12-31"
    aggregateRating:
      ratingValue: "4.9"
      reviewCount: "126"
    returnPolicy:
      description: "Return policy terms are specified in individual wholesale contracts. Please contact us for detailed information."
    shipping:
      description: "Shipping terms, rates, and delivery times are determined based on order volume, destination, and specific wholesale contract terms. Contact us for detailed shipping information for your order."
  
  # Main and common pages header settings
  header:
    description: >
      Nutcracker Pro is a B2B supplier of professional-grade products, serving the United States. Our core mission is to provide high-quality supplies at consistently low prices.
    customersTitle: "There is two way you can purchase it:"
    customers:
      - "**Retail customers** can purchase through authorized distributor AK Dealer Services."
      - "**Wholesalers or Bulk Purchasers** can purchase it by contacting us directly."

  # Contact settings
  contact:
    phone: "800.260.5051"  # Placeholder for actual phone number
    email: "info@akdealerservices.com"  # Placeholder for actual email
    
  contactSection:
    title: "Contact us"
    description: >
      Provide details of your order in any format. Our staff will review it and contact you to finalize your order. We make your work more comfortable.
    
  contactBody:
    title: "How to order?"
    description: >
      **AK Dealer Services** is an authorized distributor of Nutcracker Pro. You can purchase the product directly from the company’s website or contact us by phone or email with inquiries.
    buttons:
      - label: "Contact us"
        icon: "email-alt"
        class: "n01"
      - label: "Wholesale Inquiry"
        icon: "form"
        class: "n02"
  
  # Common product settings
  products:
    defaultButtonCartText: "Buy From Distributor"
    defaultButtonWholesaleText: "Wholesale Inquiry"
    defaultWholesaleLink: "#nutcracker-wholesale"
    defaultCurrency: "USD"
    defaultPrice: "19.99"
    defaultItemCondition: "https://schema.org/NewCondition"
    defaultAvailability: "https://schema.org/InStock"
    
  # Common slider images
  slider:
    defaultSlides:
      - image: "/images/covers/cover-1.webp"
        caption: "Nutcracker Professional Products"
      - image: "/images/covers/cover-2.webp"
        caption: "Quality Tools for Professionals"
      - image: "/images/covers/cover-3.webp"
        caption: "Professional Grade Solutions"
        
  # Cover image processing settings
  coverImage:
    desktopWidth: 756
    desktopHeight: 756
    mobileWidth: 600
    format: "webp"
    filter:
      unsharpMask:
        sigma: 0.5
        amount: 0.5
        threshold: 0

  # Footer settings
  footer:
    copyright: ". All rights reserved."
    terms_text: "By using this site, by sending messages, you agree to the processing of personal data in accordance with the"
    terms_link_text: "Terms & Conditions"
    terms_link: "/terms/"
    
#nav menus
menus:
  main:
    - name: "Hand Cleaner"
      url: "/hand-cleaner/"
      weight: 1
    - name: "8mil Nitrile Gloves"
      url: "/nitrile-gloves/"
      weight: 2
    - name: "Industrial Wipes"
      url: "/industrial-wipes-roll/"
      weight: 3
    - name: "Absorbent Pads"
      url: "/industrial-absorbent-pads/"
      weight: 4


  footer:
    - name: "About"
      url: "/about/"
      weight: 1
    - name: "Articles"
      url: "/articles/"
      weight: 2

## Settings

markup:
  goldmark:
    renderer:
      unsafe: true  # Allows HTML in markdown
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

pagination:
  pagerSize: 36

summaryLength: 30

sitemap:
  changefreq: monthly
  priority: 0.9
  filename: sitemap.xml

imaging:
  resampleFilter: "Lanczos"
  quality: 95

taxonomies: {}
disableKinds: ["taxonomy", "term"]

outputs:
  home:
    - "HTML"
    - "RSS"
  section:
    - "HTML"
  taxonomy:
    - "HTML"
  term:
    - "HTML"

minify:
  minifyOutput: true

# Google Analytics
googleAnalytics: "G-FY8F76ZGS8"  # Replace with your actual Google Analytics ID

server:
  headers:
    - for: "/**"
      values:
        X-Frame-Options: "DENY"
        X-XSS-Protection: "1; mode=block"
        X-Content-Type-Options: "nosniff"
        Referrer-Policy: "strict-origin-when-cross-origin"

  schema:
    priceValidUntil: "2026-12-31"
    aggregateRating:
      ratingValue: "4.9"
      reviewCount: "126"
