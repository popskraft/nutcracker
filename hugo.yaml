baseURL: "/"
title: "Nutcracker Products"
languageCode: "en-us"

theme: "main"

params:
  description: "Professional Hand Cleaner and Products"
  author: "Nutcracker Team"
  mainSections:
    - "products"

menus:
  main:
    - identifier: "n01"
      name: "Benefits"
      url: "#benefits"
      weight: 1
    - identifier: "n02"
      name: "Great savings"
      url: "#savings"
      weight: 2
    - identifier: "n03"
      name: "F.A.Q."
      url: "#faq"
      weight: 3
    - identifier: "n04"
      name: "Contact"
      url: "#contact"
      weight: 4
    - identifier: "n05"
      name: "All Products"
      url: "https://nutcrackerpro.com/"
      weight: 5

markup:
  goldmark:
    renderer:
      unsafe: true  # Allows HTML in markdown

outputs:
  home:
    - "HTML"
    - "RSS"
  section:
    - "HTML"
  taxonomy:
    - "HTML"
  term:
    - "HTML"

minify:
  minifyOutput: true

imaging:
  quality: 85
  resampleFilter: "Lanczos"

server:
  headers:
    - for: "/**"
      values:
        X-Frame-Options: "DENY"
        X-XSS-Protection: "1; mode=block"
        X-Content-Type-Options: "nosniff"
        Referrer-Policy: "strict-origin-when-cross-origin"
