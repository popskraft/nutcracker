baseURL: "https://nutcrackerpro.netlify.app/"
title: Professional-grade tools and products supply
languageCode: "en"
theme: "main"

# Site metadata
params:
  seoTitleAfter: "• Nutcracker Pro"
  description: Professional-grade quality without markup. Streamlined procurement process. American-focused supply chain. Understanding of tradesperson needs. Reliability in stock and delivery.
  colorScheme: "light only"
  openGraph:
    ogImage: "/images/ogimage.jpg"
    type: "website"
  
  call_to_action:
    buy_now: "Buy Now"
    wholesale_inquiry: "Wholesale Inquiry"
    read_more: "Read more"

  companyName: "Nutcracker"
  tagline: "Secret Gears Of Silent Heroes"
  subtitle: "Pro-grade essentials at accessible prices for those who keep America running"

  contact:
    phone: "800.260.5051"  # Placeholder for actual phone number
    email: "info@akdealerservices.com"  # Placeholder for actual email

  footer:
    copyright: "All rights reserved."
    terms_text: "By using this site, by sending messages, you agree to the processing of personal data in accordance with the"
    terms_link_text: "Terms & Conditions"
    terms_link: "#terms"
    
  # FAQ section
  faq:
    title: "Nutcracker Pro"
    titleColored: "F.A.Q."
    questions:
      - question: "How do you ensure the professional-grade quality of your products?"
        answer: "Every tool undergoes extensive durability testing in real-world conditions, reflecting our commitment to the 'silent heroes' who rely on equipment day in and day out. This thorough process ensures each product can handle the intense demands of professional maintenance and service."
      - question: "Are your prices truly lower compared to other suppliers?"
        answer: "Absolutely. Our streamlined operations allow us to offer professional-grade tools at prices consistently 20%-70% below the market average, delivering unmatched savings without sacrificing quality."
      - question: "Will high-demand items be in stock when I need them?"
        answer: "Yes. We maintain robust, optimized inventory levels on essential products. By monitoring real-time demand trends, we ensure that your staple items are almost always available."
      - question: "What makes your procurement process more efficient?"
        answer: "Our user-friendly online platform streamlines bulk ordering and offers quick reordering options. We also provide transparent bulk-pricing tiers, making it easier to plan your purchasing budget and avoid any downtime."
      - question: "What do you mean by a 'value-driven partnership'?"
        answer: "We want to be more than a vendor — we aim to be your long-term partner in maintenance success. With dedicated account management we help you optimize your operations and maximize your budget over the long run."      



menus:
  main:
    - identifier: "n01"
      name: "Benefits"
      url: "#benefits"
      weight: 1
    - identifier: "n02"
      name: "Great savings"
      url: "#savings"
      weight: 2
    - identifier: "n03"
      name: "F.A.Q."
      url: "#faq"
      weight: 3
    - identifier: "n04"
      name: "Contact"
      url: "#contact"
      weight: 4
    - identifier: "n05"
      name: "All Products"
      url: "https://nutcrackerpro.com/"
      weight: 5


## Settings

markup:
  goldmark:
    renderer:
      unsafe: true  # Allows HTML in markdown
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

pagination:
  pagerSize: 36

summaryLength: 30

sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml

imaging:
  resampleFilter: "Lanczos"
  quality: 95

taxonomies:
  tag: tags

outputs:
  home:
    - "HTML"
    - "RSS"
  section:
    - "HTML"
  taxonomy:
    - "HTML"
  term:
    - "HTML"

minify:
  minifyOutput: true

server:
  headers:
    - for: "/**"
      values:
        X-Frame-Options: "DENY"
        X-XSS-Protection: "1; mode=block"
        X-Content-Type-Options: "nosniff"
        Referrer-Policy: "strict-origin-when-cross-origin"
