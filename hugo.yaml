baseURL: "https://nutcrackerpro.netlify.app/"
# $siteName
title: Professional-grade tools and products supply
languageCode: "en"

# Site metadata
params:
  # SEO and metadata settings
  seoTitleAfter: "• Nutcracker Pro"
  description: Professional-grade quality without markup. Streamlined procurement process. American-focused supply chain. Understanding of tradesperson needs. Reliability in stock and delivery.
  ogImage: "/images/ogimage.jpg"
  openGrapeType: "website"
  siteLogo: "logo.svg"

  # Company information
  companyName: "NutcrackerPro"
  tagline: "Secret Gears Of Silent Heroes"
  subtitle: "Pro-grade essentials at accessible prices for those who keep America running"
  distributorName: "AK Dealer Services"
  distributorDescription: "**AK Dealer Services** is an authorized distributor of Nutcracker Pro. You can purchase the product directly from the company's website or contact by phone or email for inquiries."
  
  # Common page header settings
  header:
    defaultTitle: "**Secret Gears** Of Silent Heroes"
    defaultSubtitle: "Pro-grade essentials at accessible prices for those who keep America running"

  contact:
    phone: "800.260.5051"  # Placeholder for actual phone number
    email: "info@akdealerservices.com"  # Placeholder for actual email
    
  contactSection:
    title: "Contact Section"
    description: "Provide details of your order in any format. Our staff will review it and contact you to finalize your order. We make your work more comfortable."
    
  contactBody:
    title: "How to order?"
    description: "**AK Dealer Services** is an authorized distributor of Nutcracker Pro. You can purchase the product directly from the company's website or contact by phone or email for inquiries."
    buttons:
      - label: "Contact us"
        url: "#contact"
        icon: "email-alt"
        class: "n01"
      - label: "Wholesale Inquiry"
        url: "#wholesale"
        icon: "form"
        class: "n02"
        
  wholesaleSection:
    title: "Wholesale Inquiry"
    description: "Provide details of your order in any format. Our staff will review it and contact you to finalize your order. We make your work more comfortable."
    
  # Common product settings
  products:
    defaultButtonCartText: "Buy Now"
    defaultButtonWholesaleText: "Wholesale Inquiry"
    defaultWholesaleLink: "#wholesale"
    
  # Common savings section
  savings:
    title: "Save up to $6,500 a year"
    subtitle: "Special offer for car dealerships!"
    description: >-
      Every dollar matters in a competitive market, and we're thrilled to share a cost-saving opportunity that can make a real difference in your bottom line. As an example, on gloves alone, our team analyzed the numbers and found that by reducing the standard $12 per box price to just $4.99, businesses can save up to $1,850 annually. Depending on usage, total savings range **from $875 to $3,500 per year**.
    image: "/images/carflag.jpg"
    imageAlt: "Big Savings"
    
  # Common slider images
  slider:
    defaultSlides:
      - image: "/images/covers/cover-1.webp"
        caption: "Nutcracker Professional Products"
      - image: "/images/covers/cover-2.webp"
        caption: "Quality Tools for Professionals"
      - image: "/images/covers/cover-3.webp"
        caption: "Professional Grade Solutions"
        
  # Cover image processing settings
  coverImage:
    desktopWidth: 756
    desktopHeight: 756
    mobileWidth: 600
    format: "webp"
    filter:
      unsharpMask:
        sigma: 0.5
        amount: 0.5
        threshold: 0
        
  # Common benefits section
  benefits:
    headerTitle: "Why Choose **Nutcracker Pro**?"
    defaultColumns:
      - # Column 1
        - title: "Streamlined Procurement and Cost Control"
          content: "A transparent pricing model, bulk ordering options, and a user-friendly platform help you secure high-quality tools while staying on budget. Fewer administrative hoops mean quicker approvals and smoother purchasing cycles."
        - title: "Long-Term Value and Partnership"
          content: "Durable products, bulk-buy advantages, and ongoing consultations form a true partnership, ensuring that your operations run smoothly and your investment pays off over the long haul."
      - # Column 2
        - title: "Consistent Availability and Fast Delivery"
          content: "With a robust logistics network and emergency fulfillment options, Nutcracker Pro ensures that essential items are readily available and rapidly delivered. The result? Minimal disruptions and maximum uptime"
        - title: "Scalable Solutions for Multi-Site Operations"
          content: "From small repair shops to multi-facility corporations, Nutcracker Pro's scalable procurement systems adapt as you expand. Centralized oversight ensures consistent quality, pricing, and delivery, regardless of location."
      - # Column 3
        - title: "Compliance and Safety Assurance"
          content: "Each product meets rigorous industry standards, reducing compliance risks and safeguarding your workforce. By choosing Nutcracker Pro, you protect both your employees and your reputation."
        - title: "Bulk Bundles for Long-Term Savings"
          content: "Strategic bulk purchasing packages allow you to stretch your budget further while ensuring consistent stock levels, effectively lowering overall expenses and boosting return on investment."

  # Footer settings
  footer:
    copyright: "All rights reserved."
    terms_text: "By using this site, by sending messages, you agree to the processing of personal data in accordance with the"
    terms_link_text: "Terms & Conditions"
    terms_link: "#terms"
    
  # FAQ section
  faq:
    title: "Nutcracker Pro"
    titleColored: "F.A.Q."
    questions:
      - question: "How do you ensure the professional-grade quality of your products?"
        answer: "Every tool undergoes extensive durability testing in real-world conditions, reflecting our commitment to the 'silent heroes' who rely on equipment day in and day out. This thorough process ensures each product can handle the intense demands of professional maintenance and service."
      - question: "Are your prices truly lower compared to other suppliers?"
        answer: "Absolutely. Our streamlined operations allow us to offer professional-grade tools at prices consistently 20%-70% below the market average, delivering unmatched savings without sacrificing quality."
      - question: "Will high-demand items be in stock when I need them?"
        answer: "Yes. We maintain robust, optimized inventory levels on essential products. By monitoring real-time demand trends, we ensure that your staple items are almost always available."
      - question: "What makes your procurement process more efficient?"
        answer: "Our user-friendly online platform streamlines bulk ordering and offers quick reordering options. We also provide transparent bulk-pricing tiers, making it easier to plan your purchasing budget and avoid any downtime."
      - question: "What do you mean by a 'value-driven partnership'?"
        answer: "We want to be more than a vendor — we aim to be your long-term partner in maintenance success. With dedicated account management we help you optimize your operations and maximize your budget over the long run."      


menus:
  main:
    - identifier: "n01"
      name: "Benefits"
      url: "#benefits"
      weight: 1
    - identifier: "n02"
      name: "Great savings"
      url: "#savings"
      weight: 2
    - identifier: "n03"
      name: "F.A.Q."
      url: "#faq"
      weight: 3
    - identifier: "n04"
      name: "Contact"
      url: "#contact"
      weight: 4
    - identifier: "n05"
      name: "About Us"
      url: "/about/"
      weight: 5



## Settings

markup:
  goldmark:
    renderer:
      unsafe: true  # Allows HTML in markdown
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

pagination:
  pagerSize: 36

summaryLength: 30

sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml

imaging:
  resampleFilter: "Lanczos"
  quality: 95

taxonomies:
  tag: tags

outputs:
  home:
    - "HTML"
    - "RSS"
  section:
    - "HTML"
  taxonomy:
    - "HTML"
  term:
    - "HTML"

minify:
  minifyOutput: true

server:
  headers:
    - for: "/**"
      values:
        X-Frame-Options: "DENY"
        X-XSS-Protection: "1; mode=block"
        X-Content-Type-Options: "nosniff"
        Referrer-Policy: "strict-origin-when-cross-origin"
