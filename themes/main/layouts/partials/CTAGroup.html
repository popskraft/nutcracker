<ul id="buttons21" class="style2 buttons">
  {{ if .Page.Params.productLink }}
  <li>
    <a href="{{ .Page.Params.productLink }}" class="button n01" role="button">
      <svg aria-labelledby="buttons21-icon-1-title">
        <title id="buttons21-icon-1-title">Cart (Alt)</title>
        <use xlink:href="/icons.svg#cart-alt"></use>
      </svg><span class="label">{{ .Page.Params.buttonCartText | default "Buy Gloves" | markdownify }}</span></a>
  </li>
  {{ end }}
  {{ if .Page.Params.wholesaleLink }}
  <li>
    <a href="{{ .Page.Params.wholesaleLink }}" class="button n02" role="button">
      <svg aria-labelledby="buttons21-icon-2-title">
        <title id="buttons21-icon-2-title">Form</title>
        <use xlink:href="/icons.svg#form"></use>
      </svg><span class="label">{{ .Page.Params.buttonWholesaleText | default "Wholesale Inquiry" | markdownify }}</span></a>
  </li>
  {{ end }}
</ul>
