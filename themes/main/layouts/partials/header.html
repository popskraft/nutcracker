<header id="header">
    <div id="siteHeaderStatic" class="container columns">
        <div class="wrapper">
            <div class="inner">
                <div>
                    <a href="{{ "/" | relURL }}" id="logo" class="image">
                        <img src="{{ "images/logoHeader.svg" | relURL }}" alt="{{ .Site.Title }}" />
                    </a>
                </div>
                <div>
                    <nav>
                        {{ range .Site.Menus.main }}
                        <a href="{{ .URL }}" class="nav-link">{{ .Name }}</a>
                        {{ end }}
                    </nav>
                </div>
            </div>
        </div>
    </div>
</header>
