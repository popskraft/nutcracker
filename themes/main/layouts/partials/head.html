<style>
  @media (min-width: 737px) and (max-width: 1680px) {
    body {
      font-size: 105%;
      /* font-size: clamp(calc(0.875rem* 1.25), 1.25vw, 5rem); */
    }
  }

  /* Collapsed FAQ */
  .collapse {
    cursor: pointer;
  }

  .collapse .collapse-target-self,
  .collapse .collapse-parent {
    opacity: 0;
    height: 0;
    overflow: hidden;
    transition: all 1s ease;
  }

  .collapse:not(.show) .collapse-target-self,
  .collapse:not(.show) .collapse-parent {
    margin-bottom: -1rem;
    padding-top: 0;
    padding-bottom: 0;
  }

  .collapse.show .collapse-target-self,
  .collapse.show .collapse-parent {
    opacity: 1;
    height: auto;
  }

  .collapse:not(.show)>.wrapper>.inner> :nth-child(1) {
    width: 100% !important;
  }
</style><!-- mnbnbxmbzxmncbzxc -->

<script defer>
  const htmlElement = document.querySelector('html');

  function throttle(func, limit) {
    let inThrottle;
    return function () {
      if (!inThrottle) {
        func.apply(this, arguments);
        inThrottle = true;
        setTimeout(() => inThrottle = false, limit);
      }
    };
  }

  window.addEventListener('scroll', throttle(() => {
    if (window.pageYOffset > 0) {
      htmlElement.classList.add('scrolled');
    } else {
      htmlElement.classList.remove('scrolled');
    }
  }, 200)); // Throttle scroll event to once every 200ms
</script><!-- mnbnbxmbzxmncbzxc -->
